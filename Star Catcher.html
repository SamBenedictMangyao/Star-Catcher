<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Catcher</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      background: #101427;
      color: #f7f4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, #30264f 0%, transparent 55%),
        #101427;
    }

    body::before,
    body::after {
      position: fixed;
      inset: -30%;
      z-index: 0;
      content: "";
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(ellipse at 18% 35%, #a78bfa22, transparent 35%),
        radial-gradient(ellipse at 82% 68%, #48d9d022, transparent 32%),
        radial-gradient(ellipse at 68% 18%, #ff78b722, transparent 30%);
      animation: aurora-drift 18s ease-in-out infinite alternate;
    }

    body::after {
      background-image:
        radial-gradient(circle, #ffffffa8 1px, transparent 1.8px),
        radial-gradient(circle, #d5c9ff88 1px, transparent 1.8px);
      background-position: 0 0, 34px 52px;
      background-size: 110px 110px, 150px 150px;
      animation: starlight 5s ease-in-out infinite alternate;
      opacity: 0.34;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 620px);
      text-align: center;
    }

    h1 {
      display: inline-block;
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.5rem);
      letter-spacing: -0.06em;
      animation: title-bob 3.2s ease-in-out infinite;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #b8b5d1;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat {
      min-width: 112px;
      padding: 10px 16px;
      border: 1px solid #373854;
      border-radius: 14px;
      background: #1a1c32;
      color: #bbb9d2;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      color: #fff;
      font-size: 1.25rem;
    }

    #arena {
      position: relative;
      height: min(55vh, 360px);
      min-height: 250px;
      overflow: hidden;
      border: 1px solid #454267;
      border-radius: 20px;
      background:
        radial-gradient(ellipse at 15% 20%, #a78bfa20, transparent 45%),
        radial-gradient(ellipse at 85% 80%, #48d9d018, transparent 45%),
        linear-gradient(145deg, #202344, #15182e);
      background-size: 140% 140%, 140% 140%, 100% 100%;
      animation: arena-glow 12s ease-in-out infinite alternate;
      box-shadow: 0 20px 60px #07091488;
    }

    #target {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      width: var(--star-size, 50px);
      height: var(--star-size, 50px);
      margin: 0;
      padding: 0;
      place-items: center;
      transform: translate(-50%, -50%);
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 50%;
      background: var(--star-color, #ffd166);
      box-shadow: 0 0 28px var(--star-glow, #ffd166aa);
      color: var(--star-ink, #392c11);
      font-size: var(--star-font-size, 1.8rem);
      line-height: 1;
      cursor: pointer !important;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      animation: star-pulse 1.1s ease-in-out infinite alternate;
      will-change: left, top, transform;
    }

    #target[hidden] {
      display: none;
    }

    #target:hover {
      filter: brightness(1.18);
    }

    #target[data-kind="zigzag"] {
      --star-color: #ffd166;
      --star-glow: #ffd166aa;
      --star-ink: #392c11;
    }

    #target[data-kind="horizontal"] {
      --star-color: #64e8ff;
      --star-glow: #64e8ffbb;
      --star-ink: #10313b;
    }

    #target[data-kind="vertical"] {
      --star-color: #ff83bc;
      --star-glow: #ff83bcbb;
      --star-ink: #40192c;
    }

    #target[data-kind="erratic"] {
      --star-color: #bd9aff;
      --star-glow: #bd9affcc;
      --star-ink: #25183e;
    }

    #target[data-kind="diagonal"] {
      --star-color: #8df0a9;
      --star-glow: #8df0a9cc;
      --star-ink: #173321;
    }

    #target[data-kind="orbit"] {
      --star-color: #ff9e6d;
      --star-glow: #ff9e6dcc;
      --star-ink: #3c2116;
    }

    #target[data-kind="wave"] {
      --star-color: #f4a9ff;
      --star-glow: #f4a9ffcc;
      --star-ink: #35183d;
    }

    #target[data-kind="red"] {
      --star-color: #ff5364;
      --star-glow: #ff304fcc;
      --star-ink: #4a1019;
      --star-size: 36px;
      --star-font-size: 1.35rem;
    }

    #target.popping {
      z-index: 2;
      animation: star-pop 280ms cubic-bezier(0.2, 0.8, 0.3, 1) forwards !important;
    }

    #target.wobbling {
      animation: star-wobble 240ms ease-in-out !important;
    }

    .confetti-piece {
      position: absolute;
      z-index: 3;
      width: 8px;
      height: 8px;
      left: var(--origin-x);
      top: var(--origin-y);
      border-radius: 2px;
      pointer-events: none;
      animation: confetti-burst 700ms cubic-bezier(0.1, 0.65, 0.4, 1) forwards;
    }

    #target:focus-visible,
    #start:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    #message {
      min-height: 28px;
      margin: 16px 0 10px;
      color: #d3d0e7;
    }

    #start {
      min-width: 150px;
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: #a78bfa;
      color: #17112a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #start:hover {
      background: #b9a4ff;
    }

    @keyframes title-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes star-pulse {
      from { transform: translate(-50%, -50%) scale(0.94); }
      to { transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes star-pop {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      42% { transform: translate(-50%, -50%) scale(1.7); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.15); opacity: 0; }
    }

    @keyframes star-wobble {
      0%, 100% { transform: translate(-50%, -50%) rotate(0) scale(1); }
      20% { transform: translate(-50%, -50%) rotate(-13deg) scale(1.12); }
      45% { transform: translate(-50%, -50%) rotate(12deg) scale(1.08); }
      70% { transform: translate(-50%, -50%) rotate(-8deg) scale(1.04); }
    }

    @keyframes confetti-burst {
      to {
        transform: translate(var(--travel-x), var(--travel-y)) rotate(var(--spin));
        opacity: 0;
      }
    }

    @keyframes aurora-drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 1%, 0) scale(1.08); }
    }

    @keyframes starlight {
      from { opacity: 0.18; }
      to { opacity: 0.48; }
    }

    @keyframes arena-glow {
      from { background-position: 0% 0%, 100% 100%, center; }
      to { background-position: 100% 100%, 0% 0%, center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Star Catcher</h1>
    <p class="subtitle">Catch as many stars as you can in 30 seconds!</p>

    <section class="stats" aria-label="Game stats">
      <div class="stat">Score<strong id="score">0</strong></div>
      <div class="stat">Time<strong id="time">30</strong></div>
      <div class="stat">Best<strong id="best">0</strong></div>
    </section>

    <div id="arena" role="group" aria-label="Game area">
      <button id="target" type="button" aria-label="Catch the star" hidden>★</button>
    </div>
    <p id="message" aria-live="polite">Press start when you’re ready.</p>
    <button id="start" type="button">Start game</button>
  </main>

  <script>
    const arena = document.querySelector("#arena");
    const target = document.querySelector("#target");
    const scoreDisplay = document.querySelector("#score");
    const timeDisplay = document.querySelector("#time");
    const bestDisplay = document.querySelector("#best");
    const message = document.querySelector("#message");
    const startButton = document.querySelector("#start");

    const starTypes = [
      { kind: "zigzag", points: 2, clicks: 2, name: "Gold star", speed: 170 },
      { kind: "horizontal", points: 3, clicks: 3, name: "Cyan star", speed: 230 },
      { kind: "vertical", points: 3, clicks: 2, name: "Pink star", speed: 210 },
      { kind: "erratic", points: 5, clicks: 3, name: "Violet star", speed: 200 },
      { kind: "diagonal", points: 4, clicks: 2, name: "Green star", speed: 260 },
      { kind: "orbit", points: 4, clicks: 3, name: "Orange star", speed: 3.4 },
      { kind: "wave", points: 4, clicks: 2, name: "Magenta star", speed: 190 },
      { kind: "red", points: 10, clicks: 4, name: "Red star", speed: 460 },
    ];
    let score = 0;
    let secondsLeft = 30;
    let timerId;
    let animationId;
    let playing = false;
    let starPopping = false;
    let remainingClicks = 0;
    let activeStar;
    let lastFrameTime = 0;
    let erraticDirection = { x: 1, y: 1 };
    let nextErraticTurn = 0;
    let horizontalDirection = 1;
    let verticalDirection = 1;
    const position = { x: 0, y: 0, elapsed: 0, zigzagCenterY: 0 };
    let best = Number(localStorage.getItem("star-catcher-best")) || 0;
    bestDisplay.textContent = best;

    function bounds() {
      const radius = target.offsetWidth / 2;
      return {
        minX: radius,
        maxX: Math.max(radius, arena.clientWidth - radius),
        minY: radius,
        maxY: Math.max(radius, arena.clientHeight - radius),
      };
    }

    function reflect(value, direction, min, max) {
      if (value > max) return { value: max - (value - max), direction: -1 };
      if (value < min) return { value: min + (min - value), direction: 1 };
      return { value, direction };
    }

    function chooseStar() {
      activeStar = starTypes[Math.floor(Math.random() * starTypes.length)];
      remainingClicks = activeStar.clicks;
      target.dataset.kind = activeStar.kind;
      target.setAttribute("aria-label", `${activeStar.name}, ${activeStar.points} points`);
      const area = bounds();
      position.x = area.minX + Math.random() * (area.maxX - area.minX);
      position.y = area.minY + Math.random() * (area.maxY - area.minY);
      position.elapsed = 0;
      position.zigzagCenterY = position.y;
      horizontalDirection = Math.random() < 0.5 ? -1 : 1;
      verticalDirection = Math.random() < 0.5 ? -1 : 1;
      erraticDirection = {
        x: Math.random() < 0.5 ? -1 : 1,
        y: Math.random() < 0.5 ? -1 : 1,
      };
      nextErraticTurn = 0;
      starPopping = false;
      target.classList.remove("popping");
      target.style.left = `${position.x}px`;
      target.style.top = `${position.y}px`;
    }

    function burstConfetti() {
      const colors = ["#ffd166", "#64e8ff", "#ff83bc", "#bd9aff", "#8df0a9", "#ff5364"];
      for (let i = 0; i < 16; i += 1) {
        const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.25;
        const distance = 34 + Math.random() * 54;
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.setAttribute("aria-hidden", "true");
        piece.style.setProperty("--origin-x", `${position.x}px`);
        piece.style.setProperty("--origin-y", `${position.y}px`);
        piece.style.setProperty("--travel-x", `${Math.cos(angle) * distance}px`);
        piece.style.setProperty("--travel-y", `${Math.sin(angle) * distance}px`);
        piece.style.setProperty("--spin", `${Math.random() * 540 - 270}deg`);
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        if (i % 3 === 0) piece.style.borderRadius = "50%";
        piece.addEventListener("animationend", () => piece.remove(), { once: true });
        arena.append(piece);
      }
    }

    function animateStar(timestamp) {
      if (!playing || starPopping) return;
      const delta = lastFrameTime ? Math.min((timestamp - lastFrameTime) / 1000, 0.05) : 0;
      lastFrameTime = timestamp;
      position.elapsed += delta;
      const area = bounds();

      if (activeStar.kind === "zigzag") {
        const reflectedX = reflect(position.x + horizontalDirection * activeStar.speed * delta, horizontalDirection, area.minX, area.maxX);
        position.x = reflectedX.value;
        horizontalDirection = reflectedX.direction;
        position.zigzagCenterY += delta * activeStar.speed * 0.35 * verticalDirection;
        const reflectedY = reflect(position.zigzagCenterY, verticalDirection, area.minY + 36, area.maxY - 36);
        position.zigzagCenterY = reflectedY.value;
        verticalDirection = reflectedY.direction;
        position.y = position.zigzagCenterY + Math.sin(position.elapsed * 8) * 32;
      } else if (activeStar.kind === "horizontal") {
        const next = reflect(position.x + horizontalDirection * activeStar.speed * delta, horizontalDirection, area.minX, area.maxX);
        position.x = next.value;
        horizontalDirection = next.direction;
      } else if (activeStar.kind === "vertical") {
        const next = reflect(position.y + verticalDirection * activeStar.speed * delta, verticalDirection, area.minY, area.maxY);
        position.y = next.value;
        verticalDirection = next.direction;
      } else if (activeStar.kind === "orbit") {
        const radiusX = Math.max(0, (area.maxX - area.minX) * 0.38);
        const radiusY = Math.max(0, (area.maxY - area.minY) * 0.38);
        position.x = (area.minX + area.maxX) / 2 + Math.cos(position.elapsed * activeStar.speed) * radiusX;
        position.y = (area.minY + area.maxY) / 2 + Math.sin(position.elapsed * activeStar.speed) * radiusY;
      } else if (activeStar.kind === "wave") {
        const next = reflect(position.x + horizontalDirection * activeStar.speed * delta, horizontalDirection, area.minX, area.maxX);
        position.x = next.value;
        horizontalDirection = next.direction;
        position.y = position.zigzagCenterY + Math.sin(position.elapsed * 5) * Math.min(70, (area.maxY - area.minY) * 0.3);
      } else if (activeStar.kind === "diagonal") {
        const nextX = reflect(position.x + erraticDirection.x * activeStar.speed * delta, erraticDirection.x, area.minX, area.maxX);
        const nextY = reflect(position.y + erraticDirection.y * activeStar.speed * delta, erraticDirection.y, area.minY, area.maxY);
        position.x = nextX.value;
        position.y = nextY.value;
        erraticDirection = { x: nextX.direction, y: nextY.direction };
      } else {
        if (position.elapsed >= nextErraticTurn) {
          const angle = Math.random() * Math.PI * 2;
          erraticDirection = { x: Math.cos(angle), y: Math.sin(angle) };
          const turnDelay = activeStar.kind === "red" ? 0.12 + Math.random() * 0.2 : 0.35 + Math.random() * 0.5;
          nextErraticTurn = position.elapsed + turnDelay;
        }
        const nextX = reflect(position.x + erraticDirection.x * activeStar.speed * delta, erraticDirection.x, area.minX, area.maxX);
        const nextY = reflect(position.y + erraticDirection.y * activeStar.speed * delta, erraticDirection.y, area.minY, area.maxY);
        position.x = nextX.value;
        position.y = nextY.value;
        erraticDirection = { x: nextX.direction, y: nextY.direction };
      }

      position.y = Math.min(area.maxY, Math.max(area.minY, position.y));
      target.style.left = `${position.x}px`;
      target.style.top = `${position.y}px`;
      animationId = requestAnimationFrame(animateStar);
    }

    function endGame() {
      playing = false;
      starPopping = false;
      clearInterval(timerId);
      cancelAnimationFrame(animationId);
      target.hidden = true;
      target.classList.remove("popping");
      startButton.textContent = "Play again";
      message.textContent = `Time’s up! You caught ${score} ${score === 1 ? "star" : "stars"}.`;
      if (score > best) {
        best = score;
        localStorage.setItem("star-catcher-best", String(best));
        bestDisplay.textContent = best;
        message.textContent += " New best score!";
      }
    }

    startButton.addEventListener("click", () => {
      clearInterval(timerId);
      cancelAnimationFrame(animationId);
      score = 0;
      secondsLeft = 30;
      playing = true;
      starPopping = false;
      lastFrameTime = 0;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = secondsLeft;
      message.textContent = "Go! Catch the star!";
      startButton.textContent = "Restart";
      target.hidden = false;
      chooseStar();
      animationId = requestAnimationFrame(animateStar);

      timerId = setInterval(() => {
        secondsLeft -= 1;
        timeDisplay.textContent = secondsLeft;
        if (secondsLeft <= 0) endGame();
      }, 1000);
    });

    target.addEventListener("click", () => {
      if (!playing || starPopping) return;
      remainingClicks -= 1;
      target.classList.remove("wobbling");
      void target.offsetWidth;
      target.classList.add("wobbling");

      if (remainingClicks === 0) {
        score += activeStar.points;
        scoreDisplay.textContent = score;
        starPopping = true;
        cancelAnimationFrame(animationId);
      }
    });

    target.addEventListener("dragstart", (event) => {
      event.preventDefault();
    });

    target.addEventListener("animationend", (event) => {
      if (event.animationName === "star-wobble") {
        target.classList.remove("wobbling");
        if (starPopping) {
          burstConfetti();
          target.classList.add("popping");
        }
        return;
      }

      if (event.animationName === "star-pop") {
        target.classList.remove("popping");
        if (!playing) return;
        chooseStar();
        lastFrameTime = 0;
        animationId = requestAnimationFrame(animateStar);
      }
    });
  </script>
</body>
</html>
